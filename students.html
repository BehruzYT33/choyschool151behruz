:root{
  --primary:#0a1f44;
  --primary-light:#1e3a8a;
  --accent:#f59e0b;
  --accent-2:#06b6d4;
  --accent-3:#8b5cf6;
  --accent-4:#10b981;
  --accent-5:#ec4899;
  --dark:#050b1a;
  --light:#f8fafc;
  --gradient: linear-gradient(135deg,#0a1f44 0%,#1e3a8a 40%,#3b82f6 70%,#06b6d4 100%);
  --gradient-gold: linear-gradient(135deg,#f59e0b,#fbbf24,#fcd34d);
  --gradient-aurora: linear-gradient(135deg,#8b5cf6 0%,#06b6d4 50%,#10b981 100%);
  --glass: rgba(255,255,255,.08);
  --glass-border: rgba(255,255,255,.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Manrope',sans-serif;background:var(--light);color:var(--dark);overflow-x:hidden;line-height:1.6;}

.bg-decor{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#f8fafc 0%,#eff6ff 50%,#f8fafc 100%);}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4;animation:float 25s ease-in-out infinite;}
.blob.b1{width:600px;height:600px;background:radial-gradient(circle,#3b82f6,transparent 70%);top:-150px;left:-150px;}
.blob.b2{width:500px;height:500px;background:radial-gradient(circle,#f59e0b,transparent 70%);top:35%;right:-200px;animation-delay:-8s;}
.blob.b3{width:550px;height:550px;background:radial-gradient(circle,#06b6d4,transparent 70%);bottom:-150px;left:25%;animation-delay:-16s;}
.blob.b4{width:400px;height:400px;background:radial-gradient(circle,#8b5cf6,transparent 70%);top:60%;left:-100px;animation-delay:-12s;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1);}25%{transform:translate(80px,-60px) scale(1.15);}50%{transform:translate(-50px,80px) scale(.9);}75%{transform:translate(60px,40px) scale(1.05);}}

header{position:fixed;top:0;width:100%;z-index:1000;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;transition:all .5s cubic-bezier(.4,0,.2,1);background:transparent;}
header.scrolled{background:rgba(255,255,255,.85);backdrop-filter:blur(24px) saturate(180%);padding:14px 6%;box-shadow:0 8px 40px rgba(10,31,68,.1);border-bottom:1px solid rgba(255,255,255,.5);}
.logo{display:flex;align-items:center;gap:14px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.2rem;color:#fff;transition:color .4s;text-decoration:none;}
header.scrolled .logo{color:var(--primary);}
.logo-icon{width:54px;height:54px;border-radius:16px;background:var(--gradient-gold);display:grid;place-items:center;font-size:1.6rem;color:#fff;box-shadow:0 10px 30px rgba(245,158,11,.5);animation:pulse 3s ease-in-out infinite;position:relative;overflow:hidden;}
.logo-icon::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);animation:shine 3s linear infinite;}
@keyframes shine{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.logo-text small{display:block;font-family:'Manrope';font-size:.7rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:.7;}

nav ul{display:flex;gap:30px;list-style:none;}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;position:relative;padding:8px 0;transition:color .3s;}
header.scrolled nav a{color:var(--dark);}
nav a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--gradient-gold);transition:width .4s;border-radius:2px;}
nav a:hover::after{width:100%;}
nav a:hover{color:var(--accent);}
.burger{display:none;color:#fff;font-size:1.5rem;cursor:pointer;background:none;border:none;}
header.scrolled .burger{color:var(--dark);}

.hero{min-height:70vh;position:relative;background:var(--gradient);display:flex;align-items:center;padding:180px 6% 100px;overflow:hidden;text-align:center;}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%, rgba(255,255,255,.15) 0%, transparent 40%),radial-gradient(circle at 80% 70%, rgba(245,158,11,.2) 0%, transparent 40%);}
.hero-inner{max-width:900px;margin:0 auto;position:relative;z-index:2;}
.hero-badge{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:50px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:.85rem;font-weight:700;margin-bottom:28px;animation:fadeUp .8s ease both;}
.hero-badge i{color:var(--accent);}
.hero h1{font-family:'Unbounded',sans-serif;font-size:clamp(2rem,5vw,3.6rem);font-weight:900;color:#fff;line-height:1.1;margin-bottom:24px;animation:fadeUp .8s ease .1s both;letter-spacing:-.02em;}
.hero h1 .accent{background:var(--gradient-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{color:rgba(255,255,255,.85);font-size:1.15rem;margin-bottom:20px;animation:fadeUp .8s ease .2s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}

.section{padding:100px 6%;position:relative;}
.section-title{text-align:center;max-width:800px;margin:0 auto 60px;}
.section-tag{display:inline-block;padding:10px 24px;border-radius:50px;background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(6,182,212,.12));color:var(--primary-light);font-size:.8rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:24px;border:1px solid rgba(59,130,246,.15);}
.section-title h2{font-family:'Unbounded',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;color:var(--primary);margin-bottom:20px;letter-spacing:-.02em;}
.section-title h2 .grad{background:var(--gradient-aurora);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.section-title p{color:#64748b;font-size:1.1rem;}

/* Фильтры */
.filters{max-width:1200px;margin:0 auto 50px;display:flex;flex-direction:column;gap:24px;align-items:center;}
.search-box{position:relative;width:100%;max-width:520px;}
.search-box input{width:100%;padding:18px 24px 18px 56px;border-radius:50px;border:2px solid rgba(59,130,246,.15);background:#fff;font-size:1rem;font-family:'Manrope';outline:none;transition:all .3s;box-shadow:0 8px 30px rgba(10,31,68,.06);}
.search-box input:focus{border-color:var(--accent);box-shadow:0 12px 40px rgba(245,158,11,.2);}
.search-box i{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:1.1rem;}
.class-filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.class-btn{padding:10px 22px;border-radius:50px;border:2px solid rgba(59,130,246,.15);background:#fff;color:var(--primary);font-weight:700;font-size:.9rem;cursor:pointer;transition:all .3s;font-family:'Manrope';}
.class-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px);}
.class-btn.active{background:var(--gradient-gold);color:#fff;border-color:transparent;box-shadow:0 10px 30px rgba(245,158,11,.4);}

/* Карточки учеников */
.students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px;max-width:1400px;margin:0 auto;}
.student-card{background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 10px 40px rgba(10,31,68,.08);transition:all .5s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;border:1px solid rgba(59,130,246,.08);text-align:center;animation:cardIn .5s ease both;}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.student-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:5px;background:var(--card-accent,var(--gradient));transform:scaleX(0);transform-origin:left;transition:transform .5s;}
.student-card:hover{transform:translateY(-12px) scale(1.02);box-shadow:0 30px 70px rgba(10,31,68,.18);}
.student-card:hover::before{transform:scaleX(1);}
.student-avatar{width:80px;height:80px;border-radius:50%;background:var(--card-accent,var(--gradient));display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:1.8rem;font-weight:900;color:#fff;margin:0 auto 18px;box-shadow:0 12px 30px rgba(59,130,246,.35);transition:transform .5s;}
.student-card:hover .student-avatar{transform:rotate(-8deg) scale(1.1);}
.student-name{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:700;color:var(--primary);margin-bottom:10px;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center;}
.student-class{display:inline-block;padding:6px 18px;border-radius:50px;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(6,182,212,.1));color:var(--primary-light);font-weight:800;font-size:.85rem;letter-spacing:1px;border:1px solid rgba(59,130,246,.15);}
.student-no-photo{font-size:.75rem;color:#94a3b8;margin-top:10px;font-style:italic;}

.empty-state{text-align:center;padding:80px 20px;color:#94a3b8;font-size:1.1rem;grid-column:1/-1;}
.empty-state i{font-size:3rem;margin-bottom:20px;display:block;color:#cbd5e1;}

.counter{text-align:center;max-width:1200px;margin:0 auto 30px;color:#64748b;font-size:.95rem;font-weight:600;}
.counter span{color:var(--accent);font-weight:800;font-size:1.1rem;}

footer{background:var(--dark);color:#94a3b8;padding:60px 6% 30px;text-align:center;position:relative;}
footer::before{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.5),rgba(245,158,11,.5),transparent);}
footer p{font-size:.9rem;}

.reveal{opacity:0;transform:translateY(50px);transition:all 1s cubic-bezier(.4,0,.2,1);}
.reveal.active{opacity:1;transform:translateY(0);}

@media(max-width:968px){
  nav ul{display:none;}
  .burger{display:block;}
  .hero{padding:140px 6% 80px;}
  .section{padding:80px 6%;}
  .students-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
}
@media(max-width:600px){
  .hero h1{font-size:1.8rem;}
  .students-grid{grid-template-columns:1fr 1fr;gap:14px;}
  .student-card{padding:20px 14px;border-radius:18px;}
  .student-avatar{width:60px;height:60px;font-size:1.4rem;}
  .student-name{font-size:.85rem;}
  .student-class{font-size:.75rem;padding:5px 14px;}
  .class-btn{padding:8px 16px;font-size:.8rem;}
}

</head>

const classOrder = ["5а","5б","5в","6а","6б","6в","6г","7а","8а","9а","10а","10б","11а",""];

// Цвета для карточек по классам
const classColors = {
  "5а":"linear-gradient(135deg,#f59e0b,#fbbf24)",
  "5б":"linear-gradient(135deg,#06b6d4,#22d3ee)",
  "5в":"linear-gradient(135deg,#8b5cf6,#a78bfa)",
  "6а":"linear-gradient(135deg,#10b981,#34d399)",
  "6б":"linear-gradient(135deg,#ec4899,#f472b6)",
  "6в":"linear-gradient(135deg,#3b82f6,#60a5fa)",
  "6г":"linear-gradient(135deg,#f97316,#fb923c)",
  "7а":"linear-gradient(135deg,#14b8a6,#2dd4bf)",
  "8а":"linear-gradient(135deg,#a855f7,#c084fc)",
  "9а":"linear-gradient(135deg,#ef4444,#f87171)",
  "10а":"linear-gradient(135deg,#0ea5e9,#38bdf8)",
  "10б":"linear-gradient(135deg,#84cc16,#a3e635)",
  "11а":"linear-gradient(135deg,#eab308,#facc15)",
  "":"linear-gradient(135deg,#64748b,#94a3b8)"
};

const grid = document.getElementById("studentsGrid");
const searchInput = document.getElementById("searchInput");
const classFilters = document.getElementById("classFilters");
const shownCount = document.getElementById("shownCount");
const totalCount2 = document.getElementById("totalCount2");
const totalCount = document.getElementById("totalCount");

let activeClass = "all";

// Инициализация
totalCount.textContent = students.length;
totalCount2.textContent = students.length;

// Получить уникальные классы
const classes = [...new Set(students.map(s => s.cls))].sort((a,b) => classOrder.indexOf(a) - classOrder.indexOf(b));

// Создать кнопки фильтров
function createFilters(){
  classFilters.innerHTML = `<button class="class-btn active" data-class="all">Все классы</button>`;
  classes.forEach(c => {
    const label = c === "" ? "Без класса" : c;
    classFilters.innerHTML += `<button class="class-btn" data-class="${c}">${label}</button>`;
  });
  classFilters.querySelectorAll(".class-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      classFilters.querySelectorAll(".class-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeClass = btn.dataset.class;
      render();
    });
  });
}

// Получить инициалы
function getInitials(name){
  const parts = name.trim().split(/\s+/);
  if(parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}

// Рендер карточек
function render(){
  const query = searchInput.value.trim().toLowerCase();
  const filtered = students.filter(s => {
    const matchClass = activeClass === "all" || s.cls === activeClass;
    const matchSearch = s.name.toLowerCase().includes(query);
    return matchClass && matchSearch;
  });

  shownCount.textContent = filtered.length;

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i>Ничего не найдено</div>`;
    return;
  }

  grid.innerHTML = filtered.map((s, i) => {
    const color = classColors[s.cls] || classColors[""];
    const classLabel = s.cls === "" ? "Без класса" : s.cls;
    return `
      <div class="student-card" style="--card-accent:${color}; animation-delay:${i * 0.03}s">
        <div class="student-avatar">${getInitials(s.name)}</div>
        <div class="student-name">${s.name}</div>
        <div class="student-class">${classLabel}</div>
        ${!s.photo ? '<div class="student-no-photo">Нет фотографии</div>' : ''}
      </div>
    `;
  }).join("");
}

// Поиск
searchInput.addEventListener("input", render);

// Скролл хедера
window.addEventListener("scroll", () => {
  document.getElementById("header").classList.toggle("scrolled", window.scrollY > 50);
});

// Reveal анимация
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting) e.target.classList.add("active");
  });
}, {threshold:0.1});
document.querySelectorAll(".reveal").forEach(el => observer.observe(el));

// Запуск
createFilters();
render();
</script>
